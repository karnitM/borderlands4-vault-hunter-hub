<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Borderlands 4 Vault Hunter Hub</title>
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>

<header class="site-header">
<h1>Borderlands 4 Vault Hunter Hub</h1>

<nav class="navbar" aria-label="Main navigation">
<button class="menu-toggle" type="button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="nav-links">☰</button>
<div class="nav-links" id="nav-links">
<a href="index.html">Home</a>
<a href="weapons.html">Weapons</a>
<a href="vault-hunters.html">Vault Hunters</a>
<a href="builds.html">Builds</a>
<a href="login.html">Login</a>
</div>
</nav>
</header>

<main>
<div class="account-form">
<h2>Login</h2>
<p>Sign in to your Vault Hunter account.</p>

<form id="login-form">
<label for="login-email">Email</label>
<input type="email" id="login-email" name="email" autocomplete="email" required>

<label for="login-password">Password</label>
<input type="password" id="login-password" name="password" autocomplete="current-password" required>

<button type="submit" id="login-button">Login</button>
</form>

<p id="login-message" role="status" aria-live="polite"></p>

<p>
Don't have an account?
<a href="register.html">Register here</a>
</p>
</div>
</main>

<script>
const menuToggle = document.querySelector(".menu-toggle");
const navLinks = document.querySelector(".nav-links");

menuToggle.addEventListener("click", function() {
const isOpen = navLinks.classList.toggle("open");
menuToggle.setAttribute("aria-expanded", String(isOpen));
});
</script>

<script src="JS/login.js"></script>
</body>
</html>
